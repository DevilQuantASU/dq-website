name: Deploy

# Publishes dist/ (including CNAME) to the gh-pages branch after CI passes on
# a push to main, which triggers GitHub's pages-build-deployment workflow.
# workflow_run always uses this file as it exists on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy exactly the commit CI verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same tool as `npm run deploy`. gh-pages clones the repo into a cache
      # dir, which doesn't inherit checkout's auth header, so the token goes in
      # the remote URL. The commit identity comes from git config because
      # gh-pages' -u parser rejects the "[bot]" in an unquoted address.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
